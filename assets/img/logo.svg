<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="冰盞紅">
  <title>冰盞紅</title>
  <!-- 依業主提供的官方標誌（單一LOGO圖片.jpg）重繪為向量：黑環、朱紅盞、墨梅、鏤空高足。
       印刷請仍以官方原始檔為準；本檔供網頁與 favicon 使用。 -->
  <circle cx="60" cy="60" r="54" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="5"/>
  <!-- 盞的黑色底線（尖端細、盞底厚）-->
  <path d="M10 48 Q60 61 110 48 A50 31 0 0 1 10 48 Z" fill="#0B0B0B"/>
  <!-- 朱紅湯面 -->
  <path d="M16 49 Q60 59 104 49 A44 25 0 0 1 16 49 Z" fill="#B51823"/>
  <!-- 墨梅 -->
  <circle cx="60" cy="47" r="6.8" fill="#0B0B0B"/>
  <circle cx="57.6" cy="45.2" r="1.1" fill="#FFFFFF"/>
  <circle cx="62.2" cy="49" r=".9" fill="#FFFFFF"/>
  <!-- 鏤空高足 -->
  <path d="M52 76 L68 76 L75 92 L45 92 Z" fill="#0B0B0B"/>
  <path d="M55.5 79.5 L64.5 79.5 L69.5 88.5 L50.5 88.5 Z" fill="#FFFFFF"/>
</svg>
